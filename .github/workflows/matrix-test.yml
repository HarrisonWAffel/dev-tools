name: matrix-test.yml
on:
  workflow_dispatch:
    inputs:
      EXPLICIT_SCOPES:
        required: false
        type: string
      MANUAL_MATRIX:
        required: false
        type: string # In the 'include' format expected by github.
  workflow_call:
    inputs:
      EXPLICIT_SCOPES:
        required: false
        type: string
      MANUAL_MATRIX:
        required: false
        type: string # In the 'include' format expected by github.
  pull_request:

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    name: "build"
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      run: ${{ steps.build.outputs.run }}
    steps:
      - name: checkout
        if: inputs.MANUAL_MATRIX == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: generate matrix
        id: "build"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPLICIT_SCOPES: ${{ inputs.EXPLICIT_SCOPES }}
          MANUAL_MATRIX: ${{ inputs.MANUAL_MATRIX }}
        run: |
          set -eo pipefail

          if [ -n "$MANUAL_MATRIX" ]; then
            if [ -n "$EXPLICIT_SCOPES" ]; then
              echo "error: MANUAL_MATRIX and EXPLICIT_SCOPES cannot both be set" >&2
              exit 1
            fi
            echo "Using manual matrix"
            MATRIX="$(printf '%s' "$MANUAL_MATRIX" | jq -c .)"
          else
            # On a PR, diff against the base (target) SHA
            if [ "$EVENT_NAME" = "pull_request" ]; then
              export DIFF_BASE="$BASE_SHA"
            elif [ -z "$EXPLICIT_SCOPES" ]; then
              export ALL=1
            fi
            MATRIX="$(bash .github/scripts/build-matrix.sh)"
          fi

          # Expect compact {"include":[...]} JSON on a single line, bail otherwise.
          if ! echo "$MATRIX" | jq -e 'has("include") and (.include | type == "array")' >/dev/null; then
            echo "error: unexpected matrix output: $MATRIX" >&2
            exit 1
          fi

          # If the returned matrix is empty, the test job below is skipped outright.
          COUNT="$(echo "$MATRIX" | jq '.include | length')"

          # Sanity cap against accidental fan-out
          if [ "$COUNT" -gt 16 ]; then
            echo "error: too many matrix entries ($COUNT)" >&2
            exit 1
          fi

          if [ "$COUNT" -gt 0 ]; then RUN=true; else RUN=false; fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          echo "event=$EVENT_NAME, entries=$COUNT, run=$RUN"
          echo "$MATRIX" | jq .

  run:
    name: "run"
    if: ${{ needs.setup.outputs.run == 'true' }}
    needs:
      - setup
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_REGEX: ${{ matrix.V2PROV_TEST_RUN_REGEX }}
      V2PROV_TEST_DIST: ${{ matrix.V2PROV_TEST_DIST }}
      V2PROV_TEST_RUN_REGEX: ${{ matrix.V2PROV_TEST_RUN_REGEX }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "./workflow-experiments/go.mod"
      - name: test
        run: |
          cd workflow-experiments
          go test -run "$TEST_REGEX" ./...

  summary:
    if: always()
    name: "Summarize CI Run"
    needs:
      - run
      - setup
    runs-on: ubuntu-latest
    steps:
      - name: "summarize"
        run: echo The CI run has ${{ needs.run.result }}
