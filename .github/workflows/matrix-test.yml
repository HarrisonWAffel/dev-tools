name: matrix-test.yml
on:
  workflow_call:
    inputs:
      EXPLICIT_SCOPES:
        required: false
        type: string
  pull_request:

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    name: "build"
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      run: ${{ steps.build.outputs.run }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: generate matrix
        id: "build"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPLICIT_SCOPES: ${{ inputs.EXPLICIT_SCOPES }}
        run: |
          set -eo pipefail

          # On a PR, diff against the base (target) SHA 
          if [ "$EVENT_NAME" = "pull_request" ]; then
            export DIFF_BASE="$BASE_SHA"
          elif [ -z "$EXPLICIT_SCOPES" ]; then
            export ALL=1
          fi

          MATRIX="$(bash .github/scripts/resolve-provisioning-matrix.sh)"

          # Expect compact {"include":[...]} JSON on a single line, bail otherwise.
          if ! echo "$MATRIX" | jq -e 'has("include") and (.include | type == "array")' >/dev/null; then
            echo "error: unexpected matrix output: $MATRIX" >&2
            exit 1
          fi

          # If the returned matrix is empty, the test job below is skipped outright.
          COUNT="$(echo "$MATRIX" | jq '.include | length')"

          # Sanity cap against accidental fan-out
          if [ "$COUNT" -gt 16 ]; then
            echo "error: too many matrix entries ($COUNT)" >&2
            exit 1
          fi

          if [ "$COUNT" -gt 0 ]; then RUN=true; else RUN=false; fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          echo "event=$EVENT_NAME, entries=$COUNT, run=$RUN"
          echo "$MATRIX" | jq .

  run:
    name: "run"
    if: ${{ needs.setup.outputs.run == 'true' }}
    needs:
      - setup
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_REGEX: ${{ matrix.TEST_RUN_REGEX }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "./workflow-experiments/go.mod"
      - name: test
        run: |
          cd workflow-experiments
          go test -run $TEST_REGEX ./...

  summary:
    if: always()
    name: "Summarize CI Run"
    needs:
      - run
      - setup
    runs-on: ubuntu-latest
    steps:
      - name: "summarize"
        run: |
          echo " Test Summary"
          echo "--------------------------------"
          echo "Test Combinations:"
          echo "${{ needs.setup.outputs.matrix }}"
          echo "--------------------------------"
          if [[ "${{ needs.run.result }}" != "success" && "${{ needs.run.result }}" != "skipped" ]]; then
            echo "Some provisioning tests failed. Please check the logs for details."
            exit 1
          fi