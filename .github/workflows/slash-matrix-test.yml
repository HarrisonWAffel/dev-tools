name: Adhoc matrix tests
run-name: "Adhoc matrix tests for #${{ github.event.pull_request.number }}"

# Runs the tests requested by a /ptest comment (see test-slash-command.yml). Triggered when that
# workflow applies the ptest label. This runs in the normal pull_request sandbox: fork PRs get a
# read-only token, no secrets, and a PR-scoped cache.

on:
  pull_request:
    types: [labeled]

permissions: {}

# Re-adding the label cancels the previous run. The label name keeps unrelated labels out of the group.
concurrency:
  group: adhoc-matrix-tests-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  resolve-request:
    if: github.event.label.name == 'ptest'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Find latest /ptest request
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = /<!-- ptest:v1 (\{.*\}) -->/;
            const headSha = context.payload.pull_request.head.sha;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Only trust requests written by test-slash-command.yml, not markers pasted by other commenters.
            const request = comments
              .filter(c => c.user.login === 'github-actions[bot]' && c.user.type === 'Bot')
              .map(c => c.body.match(marker))
              .filter(Boolean)
              .map(m => JSON.parse(m[1]))
              .pop();
            if (!request) {
              throw new Error('No /ptest request found on this PR. Comment /ptest to start a run.');
            }
            if (request.sha !== headSha) {
              throw new Error(`The latest /ptest request was for ${request.sha}, but the PR head is ${headSha}. Comment /ptest again to test the new commit.`);
            }
            core.setOutput('matrix', JSON.stringify(request.matrix));

  # purposefully not named 'run' or 'setup', so the checks don't collide with
  # the ones matrix-test.yml adds to PRs for the standard CI flow.
  adhoc-matrix-tests:
    needs: [resolve-request]
    permissions:
      contents: read
    uses: ./.github/workflows/matrix-test.yml
    with:
      MANUAL_MATRIX: ${{ needs.resolve-request.outputs.matrix }}
